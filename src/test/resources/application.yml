spring:
  security:
    enable: false
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
      schema-locations: classpath:db/init/schema-h2.sql
#      schema-locations: classpath:schema.sql # 현재는 검색 관련
#      data-locations: classpath:data.sql # 현재는 검색 관련
      platform: h2
  batch:
    jdbc:
      initialize-schema: never

# 사용해야하는 경우 주석해제
jwt:
  secret: spring-boot-test-secret-key-1234-!!!! # JWT 시크릿 키 설정
  expiration: 1800000


# 결제 SpringBootTest 시에는 TestPropertySource 사용할 것
kakao:
  pay:
    secret-key: "default-test-secret!"
server:
  host: "http://localhost:8080"


storage:
  file-system:
    location: /tmp/spring-boot-upload-test
  tus:
    storage-path: /tmp/tus-upload-test
    upload-uri: /api/v1/images/upload
    upload-expiration: 86400


cloudfront:
  domain-name: "http://test-cloudfront-url.com"
